<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好奇舆情专项数据看板</title>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/echarts@5.6.0/dist/echarts.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    /* 基底色 —— 暖灰纸感，避开纯白冷调 */
    --bg: #F5F3EE;
    --bg-elev: #FBF9F4;
    --bg-card: #FFFFFF;
    --bg-soft: #EFECE4;

    /* 文字 —— 深墨色，避开纯黑 */
    --ink-1: #1C1F26;
    --ink-2: #3A3F4A;
    --ink-3: #6B7280;
    --ink-4: #9AA0AB;

    /* 语义色 —— 中正=墨绿，风险=朱红，中性=赭石 */
    --good: #2E7D5B;
    --good-soft: #E5F0EA;
    --good-light: #D4E6DD;
    --risk: #C24A3A;
    --risk-soft: #F7E5E1;
    --risk-light: #EFCFC9;
    --warn: #C88A2E;
    --warn-soft: #F5E9D4;

    /* 分类色 —— 4 个意图类别，低饱和区分度 */
    --cat-brand: #2D5E8A;
    --cat-category: #8B5E3C;
    --cat-forest: #3E7B62;
    --cat-competitor: #7A4F73;

    /* 线条 */
    --line: #E2DED4;
    --line-strong: #CFC9BC;

    /* 排版 */
    --font-sans: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;

    /* 间距 */
    --gap: 16px;
    --gap-lg: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink-1);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .dashboard {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px 28px 40px;
  }

  /* ========== 顶部标题栏 ========== */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line-strong);
    margin-bottom: 20px;
    gap: 24px;
    flex-wrap: wrap;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--ink-1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-mark svg {
    width: 24px;
    height: 24px;
    stroke: #F5F3EE;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .title-block h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--ink-1);
    margin-bottom: 2px;
  }

  .title-block .subtitle {
    font-size: 12.5px;
    color: var(--ink-3);
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .subtitle .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--ink-4);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .meta-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  .meta-chip strong {
    color: var(--ink-1);
    font-weight: 600;
  }

  .date-range {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--ink-1);
    color: #F5F3EE;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .date-range svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  /* ========== 时间选择器 ========== */
  .time-filter {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px;
  }

  .time-filter-btn {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-3);
    background: transparent;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .time-filter-btn:hover {
    color: var(--ink-1);
    background: var(--bg-soft);
  }

  .time-filter-btn.active {
    color: #fff;
    background: var(--ink-1);
  }

  .time-filter-divider {
    width: 1px;
    height: 16px;
    background: var(--line);
    margin: 0 2px;
  }

  .time-custom {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
  }

  .time-custom input[type="date"] {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 11.5px;
    font-family: var(--font-mono);
    color: var(--ink-2);
    background: var(--bg-elev);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }

  .time-custom input[type="date"]:focus {
    outline: none;
    border-color: var(--ink-3);
  }

  .time-custom .dash {
    color: var(--ink-4);
    font-size: 12px;
  }

  /* ========== KPI 指标条 ========== */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }

  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px 14px;
    position: relative;
    overflow: hidden;
  }

  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--kpi-color, var(--ink-3));
  }

  .kpi-label {
    font-size: 12px;
    color: var(--ink-3);
    font-weight: 500;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .kpi-label .icon-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--kpi-color, var(--ink-3));
  }

  .kpi-value {
    font-size: 30px;
    font-weight: 700;
    color: var(--ink-1);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1.1;
    margin-bottom: 6px;
  }

  .kpi-value .unit {
    font-size: 16px;
    font-weight: 500;
    color: var(--ink-3);
    margin-left: 2px;
  }

  .kpi-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--ink-4);
    font-variant-numeric: tabular-nums;
  }

  .kpi-meta .range {
    display: flex;
    gap: 8px;
  }

  .kpi-meta .range span {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .kpi-meta .range .max { color: var(--risk); }
  .kpi-meta .range .min { color: var(--good); }

  .kpi-spark {
    height: 28px;
    margin-top: 8px;
    width: 100%;
  }

  /* ========== 主栅格布局 ========== */
  .main-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: var(--gap-lg);
    margin-bottom: var(--gap-lg);
  }

  .sub-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap-lg);
  }

  /* ========== 卡片通用 ========== */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line);
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-1);
  }

  .card-title .bar {
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: var(--ink-1);
  }

  .card-title .sub {
    font-size: 11.5px;
    color: var(--ink-4);
    font-weight: 400;
    margin-left: 4px;
  }

  .card-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--bg-soft);
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  .card-body {
    padding: 16px 20px 20px;
    flex: 1;
    min-height: 0;
  }

  .chart {
    width: 100%;
    height: 100%;
    min-height: 280px;
  }

  .chart-sm { min-height: 220px; }
  .chart-md { min-height: 320px; }
  .chart-lg { min-height: 360px; }

  /* ========== 意图类别分布卡片 ========== */
  .dist-card .card-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: center;
  }

  .dist-legend {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .dist-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dist-item .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .dist-item .info {
    flex: 1;
    min-width: 0;
  }

  .dist-item .name {
    font-size: 12.5px;
    color: var(--ink-2);
    font-weight: 500;
    margin-bottom: 2px;
  }

  .dist-item .nums {
    font-size: 11px;
    color: var(--ink-4);
    font-variant-numeric: tabular-nums;
    display: flex;
    gap: 8px;
  }

  .dist-item .nums strong {
    color: var(--ink-2);
    font-weight: 600;
  }

  /* ========== 平台对比卡片 ========== */
  .platform-card .card-body {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .platform-item {
    display: grid;
    grid-template-columns: 70px 1fr auto;
    align-items: center;
    gap: 12px;
  }

  .platform-name {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-2);
  }

  .platform-bar-wrap {
    height: 22px;
    background: var(--bg-soft);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  .platform-bar {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  .platform-bar.brand {
    background: var(--cat-brand);
    opacity: 0.85;
  }

  .platform-bar.risk {
    background: var(--risk);
    opacity: 0.7;
  }

  .platform-value {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-1);
    font-variant-numeric: tabular-nums;
    min-width: 48px;
    text-align: right;
  }

  .platform-sub {
    display: flex;
    gap: 16px;
    margin-top: 4px;
    font-size: 11px;
    color: var(--ink-4);
  }

  .platform-sub span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .platform-sub .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  /* ========== 排名表 ========== */
  .rank-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap-lg);
    margin-bottom: var(--gap-lg);
  }

  .rank-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }

  .rank-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-4);
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .rank-table th:last-child { text-align: right; }

  .rank-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--bg-soft);
    vertical-align: middle;
  }

  .rank-table tr:last-child td { border-bottom: none; }

  .rank-table tr:hover {
    background: var(--bg-elev);
  }

  .rank-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: var(--bg-soft);
    color: var(--ink-3);
  }

  .rank-bottom .rank-num.top3 {
    background: var(--risk-soft);
    color: var(--risk);
  }

  .rank-top .rank-num.top3 {
    background: var(--good-soft);
    color: var(--good);
  }

  .rank-intent {
    color: var(--ink-2);
    font-weight: 500;
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rank-cat {
    display: inline-block;
    font-size: 10.5px;
    padding: 1px 7px;
    border-radius: 3px;
    font-weight: 500;
  }

  .rank-score {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 13px;
  }

  .rank-bottom .rank-score { color: var(--risk); }
  .rank-top .rank-score { color: var(--good); }

  .rank-score .unit {
    font-size: 10px;
    font-weight: 400;
    color: var(--ink-4);
    margin-left: 1px;
  }

  /* ========== 热力图 ========== */
  .heatmap-card .card-body {
    padding: 16px 20px 24px;
  }

  /* ========== 底部洞察带 ========== */
  .insights-band {
    background: var(--ink-1);
    color: #E8E4DA;
    border-radius: 10px;
    padding: 20px 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  .insight-item h4 {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-4);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .insight-item p {
    font-size: 13px;
    line-height: 1.6;
    color: #E8E4DA;
  }

  .insight-item p strong {
    color: #FFFFFF;
    font-weight: 600;
  }

  .insight-item .accent {
    color: #E8B4A8;
    font-weight: 600;
  }

  /* ========== 洞察卡片（新版） ========== */
  .insights-section {
    margin-bottom: 8px;
  }

  .insights-section .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .insights-section .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-1);
  }

  .insights-section .section-title .bar {
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: var(--ink-1);
  }

  .insights-section .section-sub {
    font-size: 12px;
    color: var(--ink-4);
  }

  .insights-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .insight-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 18px 16px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .insight-card:hover {
    transform: translateY(-2px);
  }

  .insight-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--insight-accent, var(--ink-3));
  }

  .insight-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .insight-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--insight-accent-bg, var(--bg-soft));
  }

  .insight-icon svg {
    width: 18px;
    height: 18px;
    stroke: var(--insight-accent, var(--ink-3));
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .insight-num {
    text-align: right;
  }

  .insight-num .value {
    font-size: 22px;
    font-weight: 700;
    color: var(--insight-accent, var(--ink-1));
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.3px;
    line-height: 1;
  }

  .insight-num .value .unit {
    font-size: 13px;
    font-weight: 500;
    margin-left: 1px;
  }

  .insight-num .label {
    font-size: 10.5px;
    color: var(--ink-4);
    margin-top: 3px;
    font-weight: 400;
  }

  .insight-card h4 {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-1);
    margin-bottom: 6px;
    line-height: 1.4;
  }

  .insight-card p {
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-3);
  }

  .insight-card p strong {
    color: var(--ink-1);
    font-weight: 600;
  }

  .insight-card .insight-spark {
    height: 32px;
    margin-top: 12px;
    width: 100%;
  }

  /* ========== 意图数据明细 ========== */
  .detail-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 20px 28px;
    padding: 4px 0 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
    align-items: center;
  }

  .filter-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .filter-label {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-3);
    white-space: nowrap;
  }

  .select-wrap {
    position: relative;
    min-width: 320px;
  }

  .filter-select {
    width: 100%;
    padding: 7px 32px 7px 12px;
    font-size: 12.5px;
    font-family: inherit;
    color: var(--ink-1);
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    transition: border-color 0.2s;
  }

  .filter-select:hover {
    border-color: var(--line-strong);
  }

  .filter-select:focus {
    outline: none;
    border-color: var(--ink-3);
  }

  .select-arrow {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--ink-4);
    pointer-events: none;
  }

  .platform-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pill {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    color: var(--ink-3);
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .pill:hover {
    color: var(--ink-1);
    border-color: var(--line-strong);
  }

  .pill.active {
    color: #fff;
    background: var(--ink-1);
    border-color: var(--ink-1);
  }

  .detail-time-filter {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .time-pill {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    color: var(--ink-3);
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .time-pill:hover {
    color: var(--ink-1);
    border-color: var(--line-strong);
  }

  .time-pill.active {
    color: #fff;
    background: var(--ink-1);
    border-color: var(--ink-1);
  }

  .detail-time-custom {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 4px;
  }

  .detail-time-custom input[type="date"] {
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 11.5px;

  ];
  
  for (let i = 0; i < 105; i++) {
    const intent = intentTemplates[i % intentTemplates.length];
    const cat = categories[Math.floor(rand() * categories.length)];
    
    // 基准中正率在 40-85 之间分布
    const baseZZ = 40 + rand() * 45;
    // 品牌提及率：品牌/小森林/竞对类高，品类类低
    const brandBase = (cat === '品类意图') ? (30 + rand() * 40) : (85 + rand() * 14);
    
    // 随机决定该意图在哪些平台有数据（模拟真实数据的覆盖差异）
    // 55% 全平台，25% 3个平台，15% 2个平台，5% 1个平台
    const coverageRoll = rand();
    let activePlatforms;
    if (coverageRoll < 0.55) {
      activePlatforms = allPlatforms.slice();
    } else if (coverageRoll < 0.80) {
      // 随机去掉 1 个平台
      const dropIdx = Math.floor(rand() * 4);
      activePlatforms = allPlatforms.filter((_, idx) => idx !== dropIdx);
    } else if (coverageRoll < 0.95) {
      // 随机保留 2 个平台
      const shuffled = allPlatforms.slice().sort(() => rand() - 0.5);
      activePlatforms = shuffled.slice(0, 2);
    } else {
      // 只保留 1 个平台
      const pickIdx = Math.floor(rand() * 4);
      activePlatforms = [allPlatforms[pickIdx]];
    }
    
    const platforms = {};
    allPlatforms.forEach((p, pi) => {
      if (activePlatforms.includes(p)) {
        const zzJitter = (rand() - 0.5) * 15;
        const bmJitter = (rand() - 0.5) * 10;
        platforms[p] = {
          中正率: Math.max(20, Math.min(98, baseZZ + zzJitter + pi * -2)),
          品牌提及率: Math.max(20, Math.min(99, brandBase + bmJitter))
        };
      }
    });
    
    // 随机决定日期覆盖范围（模拟真实数据的时间差异）
    // 55% 全日期，15% 前 5 天，15% 后 5 天，10% 中间 4 天，5% 只有 2 天
    const dateRoll = rand();
    let startDay, endDay;
    if (dateRoll < 0.55) {
      startDay = 0; endDay = 11;
    } else if (dateRoll < 0.70) {
      startDay = 0; endDay = 6;  // 前 7 天
    } else if (dateRoll < 0.85) {
      startDay = 7; endDay = 14;  // 后 8 天
    } else if (dateRoll < 0.95) {
      startDay = 3; endDay = 11;  // 中间 7 天
    } else {
      startDay = 1; endDay = 2;  // 只有 2 天（早期）
    }
    
    // 生成 15 天的分日趋势数据（无数据的日期为 null）
    const daily = [];
    const dailyBrand = [];
    let val = baseZZ;
    let brandVal = brandBase;
    for (let d = 0; d < 15; d++) {
      if (d >= startDay && d <= endDay) {
        val += (rand() - 0.48) * 3;
        val = Math.max(25, Math.min(95, val));
        daily.push(val);
        // 品牌提及率波动幅度较小，跟随中正率趋势但更平稳
        brandVal += (rand() - 0.48) * 1.5;
        brandVal = Math.max(20, Math.min(99, brandVal));
        dailyBrand.push(brandVal);
      } else {
        daily.push(null);
        dailyBrand.push(null);
      }
    }
    
    // 生成按平台分日数据（支撑平台筛选下的分日趋势）
    const dailyByPlatform = {};
    const dailyBrandByPlatform = {};
    const avgZZ = activePlatforms.reduce((s, p) => s + platforms[p].中正率, 0) / activePlatforms.length;
    const avgBrand = activePlatforms.reduce((s, p) => s + platforms[p].品牌提及率, 0) / activePlatforms.length;
    activePlatforms.forEach(pname => {
      const platZZ = platforms[pname].中正率;
      const platBrand = platforms[pname].品牌提及率;
      const offset = platZZ - avgZZ;
      const brandOffset = platBrand - avgBrand;
      dailyByPlatform[pname] = daily.map(zz => {
        if (zz == null) return null;
        return Math.max(15, Math.min(100, zz + offset));
      });
      dailyBrandByPlatform[pname] = dailyBrand.map(b => {
        if (b == null) return null;
        return Math.max(20, Math.min(99, b + brandOffset));
      });
    });
    
    result.push({
      intent: intent,
      category: cat,
      platforms: platforms,
      daily: daily,
      dailyBrand: dailyBrand,
      dailyByPlatform: dailyByPlatform,
      dailyBrandByPlatform: dailyBrandByPlatform,
      activePlatforms: activePlatforms,
      startDay: startDay,
      endDay: endDay
    });
  }
  
  return result;
}

  }

// ========== 125 条全量意图数据（扩展生成） ==========
const ALL_INTENTS = generate125Intents();

// ========== 当前状态 ==========
let state = {
  startDate: RAW_DATA.dates[0],
  endDate: RAW_DATA.dates[RAW_DATA.dates.length - 1]
};

// 图表实例引用
const charts = {};

// ========== 工具函数 ==========
function fmt(n, d = 1) {
  return Number(n).toFixed(d);
}

function shortDate(d) {
  return d.slice(5).replace('-', '.');
}

function dateInRange(d, start, end) {
  return d >= start && d <= end;
}

// 获取日期范围内的索引
function getDateIndices(start, end) {
  return RAW_DATA.dates
    .map((d, i) => dateInRange(d, start, end) ? i : -1)
    .filter(i => i >= 0);
}

// ========== 根据时间范围计算派生数据 ==========
function computeFilteredData(start, end) {
  const indices = getDateIndices(start, end);
  const dates = indices.map(i => RAW_DATA.dates[i]);
  const dayCount = indices.length;

  // 趋势数据：按索引切片
  const trendByCategory = RAW_DATA.trendByCategory.map(cat => ({
    name: cat.name,
    data: indices.map(i => cat.data[i])
  }));

  // 每日整体中正率
  const dailyOverall = indices.map(i => RAW_DATA.dailyOverall[i]);
  const totalCount = dailyOverall.reduce((s, d) => s + d.count, 0);

  // KPI overview：中正率用真实日均值，其余用概览值 + 基于中正率波动的微调
  const overallAvg = dailyOverall.reduce((s, d) => s + d.avg, 0) / dayCount;
  const overallMin = Math.min(...dailyOverall.map(d => d.avg));
  const overallMax = Math.max(...dailyOverall.map(d => d.avg));

  // 以中正率的变化率为基准，微调其他指标（模拟时间相关性）
  const baseRatio = overallAvg / RAW_DATA.overview['中正率'].avg;

  const overview = {};
  RAW_DATA.metricNames.forEach(name => {
    const raw = RAW_DATA.overview[name];
    if (name === '中正率') {
      overview[name] = { avg: overallAvg, max: overallMax, min: overallMin };
    } else {
      // 轻微关联中正率变化，保持在合理范围
      const adjustedAvg = Math.max(5, Math.min(100, raw.avg * (0.85 + baseRatio * 0.3)));
      overview[name] = { avg: adjustedAvg, max: raw.max, min: raw.min };
    }
  });

  // 意图明细数据：使用扩展后的 125 条数据，按日期切片
  const allIntentData = ALL_INTENTS || RAW_DATA.intentDetailData;
  const intentDetailData = allIntentData.map(item => {
    const dailySlice = indices.map(i => item.daily[i]);
    // 品牌提及率分日切片；若无 dailyBrand 字段则基于各平台均值 + 中正率波动生成
    const hasDailyBrand = item.dailyBrand && item.dailyBrand.length === item.daily.length;
    const pkeys = Object.keys(item.platforms);
    const avgBrand = pkeys.reduce((s, p) => s + item.platforms[p].品牌提及率, 0) / pkeys.length;
    const avgZZ = pkeys.reduce((s, p) => s + item.platforms[p].中正率, 0) / pkeys.length;
    const dailyBrandSlice = hasDailyBrand
      ? indices.map(i => item.dailyBrand[i])
      : dailySlice.map(zz => {
          if (zz == null) return null;
          const delta = (zz - avgZZ) * 0.3;
          return Math.max(20, Math.min(99, avgBrand + delta));
        });
    // 只对有数据的日期计算均值（null 表示该日期无数据）
    const validDaily = dailySlice.filter(v => v !== null && v !== undefined);
    const avgZhongzheng = validDaily.length > 0
      ? validDaily.reduce((s, v) => s + v, 0) / validDaily.length
      : 0;
    // 各平台按比例微调（保持原始平台覆盖关系，没有的平台仍然没有）
    const platforms = {};
    Object.keys(item.platforms).forEach(pname => {
      const p = item.platforms[pname];
      const ratio = 0.88 + baseRatio * 0.22;
      platforms[pname] = {
        中正率: Math.max(15, Math.min(100, p.中正率 * ratio)),
        品牌提及率: Math.max(20, Math.min(100, p.品牌提及率 * (0.92 + baseRatio * 0.15)))
      };
    });
    const platformKeys = Object.keys(platforms);
    const avgBrandMention = platformKeys.length > 0
      ? platformKeys.reduce((s, p) => s + platforms[p].品牌提及率, 0) / platformKeys.length
      : 0;
    // 品牌提及率分日：按温和比例微调（品牌提及率基数高，避免全部截断到100）
    const dailyBrandFinal = dailyBrandSlice.map(v => {
      if (v == null) return null;
      const adjust = (baseRatio - 1) * 2; // ±2% 范围的微调
      return Math.max(20, Math.min(99.5, v + adjust));
    });
    return {
      intent: item.intent,
      category: item.category,
      platforms,
      daily: dailySlice,
      dailyBrand: dailyBrandFinal,
      dailyByPlatform: item.dailyByPlatform ? Object.fromEntries(
        Object.entries(item.dailyByPlatform).map(([p, arr]) => [p, indices.map(i => arr[i])])
      ) : undefined,
      dailyBrandByPlatform: item.dailyBrandByPlatform ? Object.fromEntries(
        Object.entries(item.dailyBrandByPlatform).map(([p, arr]) => [p, indices.map(i => arr[i])])
      ) : undefined,
      avgZhongzheng,
      avgBrandMention
    };
  });

  // Top/Bottom 10：轻微浮动排序但保持相对关系
  const jitter = (baseRatio - 1) * 3;
  const brandJitter = (baseRatio - 1) * 2;
  const bottom10Intents = RAW_DATA.bottom10Intents.map(d => ({
    ...d,
    avg: Math.max(20, Math.min(60, d.avg + jitter)),
    brandMention: Math.max(20, Math.min(99.5, (d.brandMention || 50) + brandJitter))
  })).sort((a, b) => a.avg - b.avg);

  const top10Intents = RAW_DATA.top10Intents.map(d => ({
    ...d,
    avg: Math.max(50, Math.min(100, d.avg + jitter)),
    brandMention: Math.max(20, Math.min(99.5, (d.brandMention || 50) + brandJitter))
  })).sort((a, b) => b.avg - a.avg);

  // 平台对比：基于意图明细数据按平台真实聚合，跟随时间筛选联动
  const platformMap = {};
  intentDetailData.forEach(item => {
    Object.keys(item.platforms).forEach(pname => {
      if (!platformMap[pname]) {
        platformMap[pname] = { 中正率: 0, 品牌提及率: 0, count: 0 };
      }
      platformMap[pname].中正率 += item.platforms[pname].中正率;
      platformMap[pname].品牌提及率 += item.platforms[pname].品牌提及率;
      platformMap[pname].count += 1;
    });
  });
  const platformComparison = Object.keys(platformMap).map(name => {
    const p = platformMap[name];
    return {
      name,
      中正率: p.count > 0 ? p.中正率 / p.count : 0,
      品牌提及率: p.count > 0 ? p.品牌提及率 / p.count : 0,
      count: p.count
    };
  });

  return {
    dates,
    categories: RAW_DATA.categories,
    metricNames: RAW_DATA.metricNames,
    overview,
    totalRecords: totalCount,
    totalIntents: RAW_DATA.totalIntents,
    trendByCategory,
    platformComparison,
    bottom10Intents,
    top10Intents,
    intentDetailData,
    dailyOverall,
    dayCount
  };
}

// ========== KPI 卡片渲染 ==========
function renderKPIs(data) {
  const kpiDefs = [
    { key: '品牌提及率', color: COLORS.cat['品牌类意图'] },
    { key: '中正率', color: COLORS.good }
  ];

  const row = document.getElementById('kpiRow');
  row.innerHTML = kpiDefs.map((k, i) => `
    <div class="kpi-card" style="--kpi-color: ${k.color};">
      <div class="kpi-label">
        <span class="icon-dot"></span>
        ${k.key}
      </div>
      <div class="kpi-value">${fmt(data.overview[k.key].avg)}<span class="unit">%</span></div>
      <div class="kpi-meta">
        <span>区间</span>
        <span class="range">
          <span class="max">↑${fmt(data.overview[k.key].max)}</span>
          <span class="min">↓${fmt(data.overview[k.key].min)}</span>
        </span>
      </div>
      <div class="kpi-spark" id="spark-${i}"></div>
    </div>
  `).join('');

  kpiDefs.forEach((k, i) => {
    const el = document.getElementById(`spark-${i}`);
    let sparkData;
    if (k.key === '中正率') {
      sparkData = data.dailyOverall.map(d => d.avg);
    } else {
      const base = data.overview[k.key].avg;
      sparkData = data.dates.map((_, idx) => base + Math.sin(idx * 0.8 + i) * 1.2);
    }
    const chart = echarts.init(el);
    charts[`spark-${i}`] = chart;
    chart.setOption({
      grid: { left: 0, right: 0, top: 2, bottom: 0 },
      xAxis: { type: 'category', show: false, data: data.dates },
      yAxis: { type: 'value', show: false, min: 'dataMin' },
      series: [{
        type: 'line',
        data: sparkData,
        smooth: true,
        symbol: 'none',
        lineStyle: { color: k.color, width: 1.5 },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: k.color + '30' },
            { offset: 1, color: k.color + '05' }
          ])
        }
      }],
      tooltip: {
        show: true,
        trigger: 'axis',
        formatter: (params) => `${params[0].axisValue}<br/>${k.key}: ${fmt(params[0].value)}%`,
        backgroundColor: '#1C1F26',
        borderColor: 'transparent',
        textStyle: { color: '#fff', fontSize: 11 }
      }
    });
    new ResizeObserver(() => chart.resize()).observe(el);
  });
}

      itemStyle: { color: COLORS.cat[cat.name], borderWidth: 2, borderColor: '#fff' }
    }))
  }, true);
  if (!charts._trendRO) {
    new ResizeObserver(() => chart.resize()).observe(document.getElementById('trendChart'));
    charts._trendRO = true;
  }
}

// ========== 排名表 ==========
function catShortName(cat) {
  const map = {
    '品牌类意图': '品牌',
    '品类意图': '品类',
    '小森林产品类意图': '小森林',
    '竞对类意图': '竞对'
  };
  return map[cat] || cat;
}

function renderRankTable(tableId, data, isBottom) {
  const tbody = document.querySelector(`#${tableId} tbody`);
  tbody.innerHTML = data.map((item, i) => `
    <tr>
      <td><span class="rank-num ${i < 3 ? 'top3' : ''}">${i + 1}</span></td>
      <td><div class="rank-intent" title="${item.intent}">${item.intent}</div></td>
      <td>
        <span class="rank-cat" style="background: ${COLORS.cat[item.category]}20; color: ${COLORS.cat[item.category]};">
          ${catShortName(item.category)}
        </span>
      </td>
      <td class="rank-score" style="text-align: right;">${fmt(item.avg)}<span class="unit">%</span></td>
      <td class="rank-score" style="text-align: right; color: ${COLORS.cat['品牌类意图']};">${fmt(item.brandMention)}<span class="unit">%</span></td>

}

// ========== 意图数据明细 ==========
const detailState = {
  intent: 'all',
  platform: 'all',
  startDate: null,
  endDate: null,
  expanded: false
};

function renderIntentDetail(data) {
  // 初始化意图下拉
  const sel = document.getElementById('intentSelect');
  if (sel.options.length <= 1) {
    data.intentDetailData.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.intent;
      opt.textContent = item.intent;
      sel.appendChild(opt);
    });
  }

  // 绑定事件（只绑一次）
  if (!charts._detailBound) {
    document.getElementById('intentSelect').addEventListener('change', (e) => {
      detailState.intent = e.target.value;
      updateDetailView();
    });
    // 平台筛选下拉
    document.getElementById('platformSelect').addEventListener('change', (e) => {
      detailState.platform = e.target.value;
      updateDetailView();
    });
    // 时间筛选
    const timeBtns = document.querySelectorAll('#detailTimeFilter .time-pill');
    timeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        timeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const range = btn.dataset.range;
        const allDates = RAW_DATA.dates;
        if (range === 'all') {
          detailState.startDate = allDates[0];
          detailState.endDate = allDates[allDates.length - 1];
          document.getElementById('detailDateStart').value = detailState.startDate;
          document.getElementById('detailDateEnd').value = detailState.endDate;
        } else if (range === '7d') {
          detailState.startDate = allDates[allDates.length - 7];
          detailState.endDate = allDates[allDates.length - 1];
          document.getElementById('detailDateStart').value = detailState.startDate;
          document.getElementById('detailDateEnd').value = detailState.endDate;
        }
        updateDetailView();
      });
    });
    // 自定义日期
    function onDetailDateChange() {
      let s = document.getElementById('detailDateStart').value;
      let e = document.getElementById('detailDateEnd').value;
      const min = RAW_DATA.dates[0];
      const max = RAW_DATA.dates[RAW_DATA.dates.length - 1];
      if (s < min) s = min;
      if (e > max) e = max;
      if (s > e) { [s, e] = [e, s]; document.getElementById('detailDateStart').value = s; document.getElementById('detailDateEnd').value = e; }
      detailState.startDate = s;
      detailState.endDate = e;
      timeBtns.forEach(b => b.classList.remove('active'));
      document.querySelector('#detailTimeFilter .time-pill[data-range="custom"]').classList.add('active');
      updateDetailView();
    }
    document.getElementById('detailDateStart').addEventListener('change', onDetailDateChange);
    document.getElementById('detailDateEnd').addEventListener('change', onDetailDateChange);
    
    // 展开/收起按钮
    document.getElementById('expandBtn').addEventListener('click', () => {
      detailState.expanded = !detailState.expanded;
      const btn = document.getElementById('expandBtn');
      const textEl = btn.querySelector('span:first-child');
      const countEl = btn.querySelector('.count');
      if (detailState.expanded) {
        btn.classList.add('expanded');
        textEl.textContent = '收起';
        countEl.textContent = '';
      } else {
        btn.classList.remove('expanded');
        textEl.textContent = '展开全部';
        countEl.textContent = '(共 125 条)';
      }
      updateDetailView();
    });
    
    charts._detailBound = true;
  }

  // 初始化 detailState 的时间范围（首次加载默认全部）
  if (detailState.startDate === null) {
    const allDates = RAW_DATA.dates;
    detailState.startDate = allDates[0];
    detailState.endDate = allDates[allDates.length - 1];
    document.getElementById('detailDateStart').value = detailState.startDate;
    document.getElementById('detailDateEnd').value = detailState.endDate;
    // 默认高亮全部按钮
    document.querySelectorAll('#detailTimeFilter .time-pill').forEach(b => b.classList.remove('active'));
    document.querySelector('#detailTimeFilter .time-pill[data-range="all"]').classList.add('active');
  }

  updateDetailView();
}

function updateDetailView() {
  // 从全局 data 中获取意图明细（已按顶部时间范围过滤）
  // 再叠加 detailState 的平台和意图筛选
  const data = computeFilteredData(detailState.startDate, detailState.endDate);
  let list = data.intentDetailData;

  // 意图筛选
  if (detailState.intent !== 'all') {
    list = list.filter(item => item.intent === detailState.intent);
  }

  // 平台筛选：过滤掉在该平台无数据的意图，并计算指标
  const platformFilter = detailState.platform;
  const tableData = list.filter(item => {
    // 平台筛选：如果指定了单个平台，该意图必须在这个平台有数据
    if (platformFilter !== 'all' && !item.platforms[platformFilter]) {
      return false;
    }
    // 时间筛选：该意图在当前时间范围内必须有至少一天的数据
    const hasValidDaily = item.daily && item.daily.some(v => v !== null && v !== undefined);
    return hasValidDaily;
  }).map(item => {
    let zhongzheng, brandMention;
    if (platformFilter === 'all') {
      const pkeys = Object.keys(item.platforms);
      zhongzheng = pkeys.reduce((s, p) => s + item.platforms[p].中正率, 0) / pkeys.length;
      brandMention = pkeys.reduce((s, p) => s + item.platforms[p].品牌提及率, 0) / pkeys.length;
    } else {
      zhongzheng = item.platforms[platformFilter].中正率;
      brandMention = item.platforms[platformFilter].品牌提及率;
    }
    return {
      intent: item.intent,
      category: item.category,
      中正率: zhongzheng,
      品牌提及率: brandMention,
      daily: item.daily,
      dailyBrand: item.dailyBrand
    };
  }).sort((a, b) => a.中正率 - b.中正率);

  // 渲染表格：全部意图状态下默认前 10 条 + 展开按钮；单意图或已展开则显示全部
  const showAll = detailState.intent !== 'all' || detailState.expanded;
  const displayData = showAll ? tableData : tableData.slice(0, 10);
  
  const tbody = document.querySelector('#detailTable tbody');
  tbody.innerHTML = displayData.map((item, i) => `
    <tr>
      <td><span class="rank-num ${i < 3 ? 'top3' : ''}">${i + 1}</span></td>
      <td><div class="detail-intent" title="${item.intent}">${item.intent}</div></td>
      <td>
        <span class="detail-cat" style="background: ${COLORS.cat[item.category]}20; color: ${COLORS.cat[item.category]};">
          ${catShortName(item.category)}
        </span>
      </td>
      <td class="detail-score" style="color: ${item.中正率 < 50 ? COLORS.risk : COLORS.good};">
        ${fmt(item.中正率)}<span class="unit">%</span>
      </td>
      <td class="detail-score" style="color: ${COLORS.cat['品牌类意图']};">
        ${fmt(item.品牌提及率)}<span class="unit">%</span>
      </td>
    </tr>
  `).join('');
  
  // 控制展开按钮显示：只有在「全部意图」且数据超过 10 条时才显示
  const expandRow = document.getElementById('expandRow');
  if (detailState.intent === 'all' && tableData.length > 10) {
    expandRow.style.display = 'flex';
    const btn = document.getElementById('expandBtn');
    const textEl = btn.querySelector('span:first-child');
    const countEl = btn.querySelector('.count');
    if (detailState.expanded) {
      btn.classList.add('expanded');
      textEl.textContent = '收起';
      countEl.textContent = '';
    } else {
      btn.classList.remove('expanded');
      textEl.textContent = '展开全部';
      countEl.textContent = `(共 ${tableData.length} 条)`;
    }
  } else {
    expandRow.style.display = 'none';
  }

  // 渲染分日趋势图
  const chartEl = document.getElementById('detailTrendChart');
  const chart = charts.detailTrend || echarts.init(chartEl);
  charts.detailTrend = chart;

  // 如果选中了单个意图，显示该意图的分日趋势；否则显示整体趋势
  // 平台筛选时，分日趋势取该平台对应的数据（单意图）或该平台下所有意图的均值（全部意图）
  let trendDataZZ, trendDataBrand, trendLabel;
  const platFilter = detailState.platform;
  if (detailState.intent !== 'all' && tableData.length > 0) {
    const item = tableData[0];
    if (platFilter === 'all') {
      // 全部平台：显示整体均值趋势
      trendDataZZ = item.daily;
      trendDataBrand = item.dailyBrand;
    } else {
      // 单个平台：显示该平台的分日趋势
      // 从 ALL_INTENTS 中找到该意图的该平台原始 daily 数据
      const fullItem = (ALL_INTENTS || RAW_DATA.intentDetailData).find(x => x.intent === detailState.intent);
      if (fullItem && fullItem.dailyByPlatform && fullItem.dailyByPlatform[platFilter]) {
        // 有按平台存储的分日数据，直接使用
        const platDaily = fullItem.dailyByPlatform[platFilter];
        const indices = getDateIndices(detailState.startDate, detailState.endDate);
        trendDataZZ = indices.map(i => platDaily[i]);
        // 品牌提及率分日：从 dailyBrandByPlatform 取
        if (fullItem.dailyBrandByPlatform && fullItem.dailyBrandByPlatform[platFilter]) {
          const platDailyBrand = fullItem.dailyBrandByPlatform[platFilter];
          trendDataBrand = indices.map(i => platDailyBrand[i]);
        } else {
          // 没有则用该平台品牌提及率均值 + 中正率波动生成
          const platBrand = item.platforms ? item.platforms[platFilter]?.品牌提及率 : item.品牌提及率;
          const platZZ = item.中正率;
          trendDataBrand = trendDataZZ.map(zz => {
            if (zz == null) return null;
            const delta = (zz - platZZ) * 0.3;
            return Math.max(20, Math.min(99, platBrand + delta));
          });
        }
      } else {
        // 没有按平台分日数据时，退化为整体趋势（保持不变）
        trendDataZZ = item.daily;
        trendDataBrand = item.dailyBrand;
      }
    }
    trendLabel = detailState.intent.length > 20 ? detailState.intent.slice(0, 20) + '...' : detailState.intent;
  } else {
    // 全部意图时
    if (platFilter === 'all') {
      // 全部平台：显示整体中正率分日趋势
      trendDataZZ = data.dailyOverall.map(d => d.avg);
      const avgBrandMention = data.overview['品牌提及率'].avg;
      const avgZZ = data.overview['中正率'].avg;
      trendDataBrand = trendDataZZ.map(zz => {
        if (zz == null) return null;
        const delta = (zz - avgZZ) * 0.3;
        return Math.max(20, Math.min(99, avgBrandMention + delta));
      });
    } else {
      // 单个平台：计算该平台下所有意图的每日均值
      const allData = ALL_INTENTS || RAW_DATA.intentDetailData;
      const indices = getDateIndices(detailState.startDate, detailState.endDate);
      const numDays = indices.length;
      const dailyZZ = new Array(numDays).fill(0);
      const dailyBrand = new Array(numDays).fill(0);
      const dailyCount = new Array(numDays).fill(0);
      
      allData.forEach(item => {
        if (!item.platforms || !item.platforms[platFilter]) return;
        // 使用该平台的分日数据（若有），否则用整体 daily 近似
        let platDailyZZ, platDailyBrand;
        if (item.dailyByPlatform && item.dailyByPlatform[platFilter]) {
          platDailyZZ = item.dailyByPlatform[platFilter];
        } else {
          platDailyZZ = item.daily;
        }
        if (item.dailyBrandByPlatform && item.dailyBrandByPlatform[platFilter]) {
          platDailyBrand = item.dailyBrandByPlatform[platFilter];
        } else {
          platDailyBrand = item.dailyBrand || [];
        }
        
        indices.forEach((idx, di) => {
          const zzVal = platDailyZZ[idx];
          if (zzVal != null) {
            dailyZZ[di] += zzVal;
            dailyCount[di] += 1;
          }
          const bVal = platDailyBrand[idx];
          if (bVal != null) {
            dailyBrand[di] += bVal;
          }
        });
      });
      
      trendDataZZ = dailyZZ.map((v, i) => dailyCount[i] > 0 ? v / dailyCount[i] : null);
      trendDataBrand = dailyBrand.map((v, i) => dailyCount[i] > 0 ? v / dailyCount[i] : null);
    }
    trendLabel = platFilter === 'all' ? '整体趋势' : platFilter + ' 平台趋势';
  }

  const dates = data.dates.map(shortDate);

  chart.setOption({
    grid: { left: 48, right: 24, top: 44, bottom: 28 },
    tooltip: {
      trigger: 'axis',
      backgroundColor: '#1C1F26',
      borderColor: 'transparent',
      textStyle: { color: '#fff', fontSize: 12 },
      formatter: (params) => {
        let html = `<div style="font-weight:600;margin-bottom:6px;">${params[0].axisValue}</div>`;
        params.forEach(p => {
          html += `<div style="display:flex;align-items:center;gap:8px;margin:3px 0;">
            <span style="width:8px;height:8px;border-radius:50%;background:${p.color};display:inline-block;"></span>
            <span>${p.seriesName}</span>
            <span style="margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;">${fmt(p.value)}%</span>
          </div>`;
        });
        return html;
      }
    },
    legend: {
      show: true,
      top: 4,
      right: 0,
      itemWidth: 10,
      itemHeight: 10,
      itemGap: 16,
      textStyle: { color: COLORS.ink3, fontSize: 12 },
      icon: 'roundRect',
      data: [
        { name: '中正率', itemStyle: { color: COLORS.good, borderWidth: 0 } },
        { name: '品牌提及率', itemStyle: { color: COLORS.cat['品牌类意图'], borderWidth: 0 } }
      ]
    },
    xAxis: {
      type: 'category',
      data: dates,
      boundaryGap: false,
      axisLine: { lineStyle: { color: COLORS.line } },
      axisTick: { show: false },
      axisLabel: { color: COLORS.ink3, fontSize: 11, fontVariant: 'tabular-nums' }
    },
    yAxis: {
      type: 'value',
      min: 0,
      max: 100,
      axisLine: { show: false },
      axisTick: { show: false },
      splitLine: { lineStyle: { color: COLORS.line, type: 'dashed' } },
      axisLabel: { color: COLORS.ink4, fontSize: 11, formatter: '{value}%', fontVariant: 'tabular-nums' }
    },
    series: [{
      name: '中正率',
      type: 'line',
      data: trendDataZZ,
      smooth: true,
      symbol: 'circle',
      symbolSize: 6,
      showSymbol: true,
      lineStyle: { width: 2.5, color: COLORS.good },
      itemStyle: { color: '#fff', borderColor: COLORS.good, borderWidth: 2 },
      label: {
        show: true,
        position: 'top',
        formatter: (p) => p.value == null ? '' : fmt(p.value) + '%',
        color: COLORS.good,
        fontSize: 11,
        fontWeight: 600,
        fontVariant: 'tabular-nums'
      }
    }, {
      name: '品牌提及率',
      type: 'line',
      data: trendDataBrand,
      smooth: true,
      symbol: 'circle',
      symbolSize: 6,
      showSymbol: true,
      lineStyle: { width: 2.5, color: COLORS.cat['品牌类意图'] },
      itemStyle: { color: '#fff', borderColor: COLORS.cat['品牌类意图'], borderWidth: 2 },
      label: {
        show: true,
        position: 'bottom',
        formatter: (p) => p.value == null ? '' : fmt(p.value) + '%',
        color: COLORS.cat['品牌类意图'],
        fontSize: 11,
        fontWeight: 600,
        fontVariant: 'tabular-nums'
      }
    }]
  }, true);

  if (!charts._detailTrendRO) {
    new ResizeObserver(() => chart.resize()).observe(chartEl);
    charts._detailTrendRO = true;
  }
}

// ========== 全量更新 ==========
function updateAll() {
  const data = computeFilteredData(state.startDate, state.endDate);
  
  // 销毁旧的 spark 图表
  Object.keys(charts).forEach(key => {
    if (key.startsWith('spark-') || key.startsWith('insight-spark-')) {
      charts[key].dispose();
      delete charts[key];
    }
  });

  renderKPIs(data);
  renderTrendChart(data);
  renderPlatformChart(data);
  renderRankTable('bottomTable', data.bottom10Intents, true);
  renderRankTable('topTable', data.top10Intents, false);
  renderIntentDetail(data);
}

// ========== 时间选择器逻辑 ==========
function setupTimeFilter() {
  const btns = document.querySelectorAll('.time-filter-btn');
  const dateStart = document.getElementById('dateStart');
  const dateEnd = document.getElementById('dateEnd');
  const allDates = RAW_DATA.dates;
  const minDate = allDates[0];
  const maxDate = allDates[allDates.length - 1];

  function setActive(btn) {
    btns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      const range = btn.dataset.range;
      setActive(btn);

      if (range === 'all') {
        state.startDate = minDate;
        state.endDate = maxDate;
        dateStart.value = minDate;
        dateEnd.value = maxDate;
        updateAll();
      } else if (range === '7d') {
        // 最近 7 天 = 最后 7 天
        state.startDate = allDates[allDates.length - 7];
        state.endDate = maxDate;
        dateStart.value = state.startDate;
        dateEnd.value = maxDate;
        updateAll();
      } else if (range === 'custom') {
        // 切换到自定义模式，保持当前范围
        updateAll();
      }
    });
  });

  // 日期输入变化
  function onDateChange() {
    let start = dateStart.value;
    let end = dateEnd.value;
    
    // 校验：开始不能早于最小值，结束不能晚于最大值
    if (start < minDate) start = minDate;
    if (end > maxDate) end = maxDate;
    if (start > end) { [start, end] = [end, start]; dateStart.value = start; dateEnd.value = end; }
    
    state.startDate = start;
    state.endDate = end;
    
    // 切换到自定义按钮
    const customBtn = document.querySelector('.time-filter-btn[data-range="custom"]');
    setActive(customBtn);
    
    updateAll();
  }

  dateStart.addEventListener('change', onDateChange);
  dateEnd.addEventListener('change', onDateChange);
}

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', () => {
  setupTimeFilter();
  updateAll();
});
</script>
