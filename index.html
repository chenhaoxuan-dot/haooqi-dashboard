<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好奇舆情专项数据看板</title>

<style>
  :root {
    /* 基底色 —— 暖灰纸感，避开纯白冷调 */
    --bg: #F5F3EE;
    --bg-elev: #FBF9F4;
    --bg-card: #FFFFFF;
    --bg-soft: #EFECE4;

    /* 文字 —— 深墨色，避开纯黑 */
    --ink-1: #1C1F26;
    --ink-2: #3A3F4A;
    --ink-3: #6B7280;
    --ink-4: #9AA0AB;

    /* 语义色 —— 中正=墨绿，风险=朱红，中性=赭石 */
    --success: #2E7D32;
    --warning: #ED6C30;
    --danger: #D32F2F;
    --neutral: #8B6F4E;
    --primary: #165DFF;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--ink-2);
    line-height: 1.5;
  }
  .container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-left .logo {
    width: 48px;
    height: 48px;
    background: var(--primary);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 24px;
  }
  .header-title h1 {
    font-size: 24px;
    font-weight: 600;
    color: var(--ink-1);
  }
  .header-title p {
    font-size: 14px;
    color: var(--ink-3);
  }
  .header-right {
    display: flex;
    gap: 12px;
  }
  .btn {
    padding: 8px 16px;
    border: 1px solid var(--bg-soft);
    border-radius: 6px;
    background: var(--bg-card);
    color: var(--ink-2);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover {
    background: var(--bg-soft);
  }
  .btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--bg-card);
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .stat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .stat-label {
    font-size: 14px;
    color: var(--ink-3);
  }
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--ink-1);
  }
  .stat-change {
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .stat-change.up {
    background: #E8F5E9;
    color: var(--success);
  }
  .stat-change.down {
    background: #FFEBEE;
    color: var(--danger);
  }
  .chart-section {
    background: var(--bg-card);
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    margin-bottom: 24px;
  }
  .chart-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 24px;
    color: var(--ink-1);
  }
  .chart-legend {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .chart-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--ink-3);
  }
  .chart-legend-color {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  #main-chart {
    width: 100%;
    height: 400px;
  }
</style>

function renderDashboard(data) {
  // 渲染统计卡片
  document.getElementById('stat-brand').textContent = `${data.overview['品牌提及率'].avg.toFixed(1)}%`;
  document.getElementById('stat-avg').textContent = `${data.overview['中正率'].avg.toFixed(1)}%`;

  // 渲染趋势图
  const chart = echarts.init(document.getElementById('main-chart'));
  const option = {
    tooltip: { trigger: 'axis' },
    legend: { show: false },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: {
      type: 'category',
      boundaryGap: false,
      data: data.dates
    },
    yAxis: {
      type: 'value',
      min: 40,
      max: 65,
      axisLabel: { formatter: '{value}%' }
    },
    series: [
      {
        name: '品牌类意图',
        type: 'line',
        data: data.trendByCategory[0].data,
        lineStyle: { color: '#165DFF' },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: 'rgba(22, 93, 255, 0.3)'}, {offset: 1, color: 'rgba(22, 93, 255, 0.05)'}]) }
      },
      {
        name: '品类意图',
        type: 'line',
        data: data.trendByCategory[1].data,
        lineStyle: { color: '#8B6F4E' },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: 'rgba(139, 111, 78, 0.3)'}, {offset: 1, color: 'rgba(139, 111, 78, 0.05)'}]) }
      },

        lineStyle: { color: '#2E7D32' },

      },

        type: 'line',
        data: data.trendByCategory[3].data,
        lineStyle: { color: '#D32F2F' },

      }
    ]
  };
  chart.setOption(option);
  window.addEventListener('resize', () => chart.resize());
}
